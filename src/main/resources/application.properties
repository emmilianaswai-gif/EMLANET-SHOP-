spring.application.name=EMLANET-SHOP

# ========================
# SERVER
# ========================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ========================
# CORS
# ========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:19006,https://emlanet-shop.onrender.com}

# ========================
# DATABASE CONFIGURATION
# ========================
# Set DB_URL/DB_USERNAME/DB_PASSWORD as environment variables for deployment
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/EMLANET-SHOPdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# HIKARI CONNECTION POOL
# ========================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SpringBootHikariCP

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Nairobi
spring.jpa.open-in-view=false

# ========================
# JACKSON
# ========================
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.time-zone=Africa/Nairobi

# ========================
# ACTUATOR
# ========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ========================
# SMS GATEWAY (AfricasTalking)
# ========================
sms.africastalking.username=
sms.africastalking.api-key=

# ========================
# LOGGING
# ========================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.warn=ERROR
logging.level.org.springframework.web=INFO
logging.level.org.springframework=WARN
logging.level.com.example=INFO